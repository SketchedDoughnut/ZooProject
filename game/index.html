<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/the-ol-ham.png">
    <link rel="stylesheet" href="../shared/style.css"/>
    <link rel="stylesheet" href="../game/game.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../shared/script.js"></script>
    <script src="../game/game.js"></script>
</head>

<body>

    <!-- everything relating to the page loading -->
    <div id="loadingContainer">
        <h2>Loading...</h2>
        <!-- the loading image that goes spin -->
        <div class="loadingImageContainer">
            <!-- 
            https://beavertonhigh.wordpress.com/2019/03/05/staff-spotlight-jeffrey-buckingham/
            -->
            <img class="loadingImage spin" src="../assets/img/the-ol-ham.png">
        </div>
    </div>

    <!-- everything related to the game cards and interactive elements -->
    <div id="gameContainer">
        <div class="containerLabel">Animals</div>
        <section id="animalContainer" class="sectionContainer"></section>
        <section id="habitatContainer" class="sectionContainer"></section>
        <div class="containerLabel">Habitats</div>
    </div>

    <div id="infoContainer">
        <div id="title"></div>
        <div id="info"></div>
        <div id="slideshow"></div>
        <div id="buttons">
            <button onclick="winTransition()">Continue</button>
            <button onclick="redirect('../landing')">Home</button>
        </div>
    </div>

    <button onclick="changeCards()">change cards</button>
    <button onclick="setDifficulty(kEASY)">set easy</button>
    <button onclick="setDifficulty(kHARD)">set hard</button>
    <button onclick="sessionStorage.clear()">clear session storage</button>
    <button onclick="window.location.reload()">reload</button>
</body>

<!-- -------------------------------------------------------------------------------------------------------- -->
<!-- ALL TEMPLATE HTML -->
<!-- -------------------------------------------------------------------------------------------------------- -->
<template id="animalCard">
    <div class="cardContainer">
        <img class="imageCards" src="../assets/img/the-ol-ham.png">
    </div>
</template>

<template id="habitatCard">
    <div class="cardContainer">
        <img class="imageCards" src="../assets/img/the-ol-ham.png">
    </div>
</template>

</html>
